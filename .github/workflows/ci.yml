name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Integration suites are gated on these URLs being set, so they run here and skip on a
    # contributor's laptop. A green local run is not a claim that Postgres and Mongo were tested.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: oven
          POSTGRES_USER: oven
          POSTGRES_DB: oven_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oven"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_URL: postgres://oven:oven@localhost:5432/oven_test
      MONGO_URL: mongodb://localhost:27017/oven_test
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: oven-test
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # MinIO is started as a step rather than a service container: the image needs a `server`
      # command, and GitHub's `services:` block has no way to give one.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live; then break; fi
            sleep 2
          done
          docker exec minio mc alias set local http://localhost:9000 minioadmin minioadmin
          docker exec minio mc mb --ignore-existing local/oven-test
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      # Guards the gate itself. A typo in an env name would silently skip both integration
      # suites and still print a green run, which is the failure this catches.
      - name: Confirm the integration suites ran
        run: |
          bun test packages/db-drizzle packages/db-mongoose packages/auth-mongo packages/storage packages/queue packages/cache 2>&1 | tee /tmp/integration.log
          if grep -qE "integration tests skipped|conformance tests skipped" /tmp/integration.log; then
            echo "::error::An integration suite was skipped in CI. Check POSTGRES_URL / MONGO_URL."
            exit 1
          fi
      # Catches the failure that is silent and total: a `workspace:` range reaching a published
      # manifest makes every install fail with EUNSUPPORTEDPROTOCOL.
      # Catches documentation rot: a sample that no longer parses, or one importing a name that
      # was renamed out from under it.
      - name: Check the documentation's code samples
        run: bun scripts/check-docs.mjs
      - name: Check what would be published
        run: bun scripts/check-publish.mjs
      - name: Build site
        run: bash scripts/build-site.sh
