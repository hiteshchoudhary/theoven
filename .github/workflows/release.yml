name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Refuses to release something that would not install.
      - run: bun scripts/check-publish.mjs

      - uses: changesets/action@v1
        with:
          version: bunx changeset version
          # `bun publish`, not `changeset publish` — changesets shells out to npm, and npm does
          # not understand the `workspace:` protocol. A single `workspace:^` reaching a published
          # peerDependencies makes every install fail with EUNSUPPORTEDPROTOCOL. `bun pm pack`
          # rewrites it; the script is also idempotent, so a partial release can be re-run.
          publish: bun scripts/publish.mjs
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
